name: Create Six Mainnet Wallet Interactions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questforge-mainnet-interactions
  cancel-in-progress: false

jobs:
  interact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Create six low-gas interactions
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BOTCHAIN_RPC_URL: https://rpc.botchain.ai
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY secret is missing."; exit 1; }
          [[ "$PRIVATE_KEY" == 0x* ]] || PRIVATE_KEY="0x$PRIVATE_KEY"
          echo "::add-mask::$PRIVATE_KEY"
          CHAIN_ID=$(cast chain-id --rpc-url "$BOTCHAIN_RPC_URL")
          test "$CHAIN_ID" = "677" || { echo "RPC returned chain ID $CHAIN_ID; expected 677."; exit 1; }
          CONTRACT=$(sed -n 's/.*QUESTFORGE_MAINNET_ADDRESS = "\(0x[a-fA-F0-9]\{40\}\)".*/\1/p' lib/deployment.ts)
          test -n "$CONTRACT" || { echo "Run the mainnet deployment workflow first."; exit 1; }
          CODE=$(cast code "$CONTRACT" --rpc-url "$BOTCHAIN_RPC_URL")
          test "$CODE" != "0x" || { echo "No contract exists at $CONTRACT."; exit 1; }
          DEADLINE=$(($(date +%s) + 604800))
          cast send "$CONTRACT" 'createQuest(string,string,string,uint64,uint96,uint32)' Q Q Q "$DEADLINE" 1 6 \
            --value 6wei --private-key "$PRIVATE_KEY" --rpc-url "$BOTCHAIN_RPC_URL" >/dev/null
          QUEST_ID=$(cast call "$CONTRACT" 'questCount()(uint256)' --rpc-url "$BOTCHAIN_RPC_URL")
          GAS_PRICE=$(cast gas-price --rpc-url "$BOTCHAIN_RPC_URL")
          GAS_LIMIT=$(cast estimate "$CONTRACT" 'submitProof(uint256,string)' "$QUEST_ID" x \
            --from "$(cast wallet address --private-key "$PRIVATE_KEY")" --rpc-url "$BOTCHAIN_RPC_URL")
          FUNDING=$((GAS_LIMIT * GAS_PRICE * 120 / 100))
          : > wallet-addresses.txt
          echo "### Six BOT Chain Mainnet wallet interactions" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Wallet | Proof transaction |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for INDEX in 1 2 3 4 5 6; do
            WALLET_JSON=$(cast wallet new --json)
            ADDRESS=$(jq -r 'if type == "array" then .[0] else . end | .address' <<<"$WALLET_JSON")
            WALLET_KEY=$(jq -r 'if type == "array" then .[0] else . end | .private_key // .privateKey' <<<"$WALLET_JSON")
            test -n "$ADDRESS" && test "$ADDRESS" != "null"
            test -n "$WALLET_KEY" && test "$WALLET_KEY" != "null"
            echo "::add-mask::$WALLET_KEY"
            cast send "$ADDRESS" --value "${FUNDING}wei" --private-key "$PRIVATE_KEY" --rpc-url "$BOTCHAIN_RPC_URL" >/dev/null
            TX_JSON=$(cast send "$CONTRACT" 'submitProof(uint256,string)' "$QUEST_ID" "$INDEX" --private-key "$WALLET_KEY" --rpc-url "$BOTCHAIN_RPC_URL" --json)
            TX_HASH=$(jq -r '.transactionHash // .transaction_hash' <<<"$TX_JSON")
            test -n "$TX_HASH" && test "$TX_HASH" != "null"
            echo "$INDEX,$ADDRESS,$TX_HASH" >> wallet-addresses.txt
            echo "| $INDEX | [$ADDRESS](https://scan.botchain.ai/address/$ADDRESS) | [$TX_HASH](https://scan.botchain.ai/tx/$TX_HASH) |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Quest: [$QUEST_ID](https://scan.botchain.ai/address/$CONTRACT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload wallet addresses
        uses: actions/upload-artifact@v4
        with:
          name: wallet-addresses
          path: wallet-addresses.txt
          if-no-files-found: error
          retention-days: 30
