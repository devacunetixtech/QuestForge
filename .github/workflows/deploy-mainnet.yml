name: Deploy QuestForge to BOT Chain Mainnet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: questforge-mainnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test contract
        run: forge test --root contracts -vvv
      - name: Deploy and verify on BOT Chain Mainnet
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          BOTCHAIN_RPC_URL: https://rpc.botchain.ai
          BOTCHAIN_VERIFIER_URL: https://scan.botchain.ai/api/
        shell: bash
        run: |
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY secret is missing."; exit 1; }
          test -n "$BLOCKSCOUT_API_KEY" || { echo "BLOCKSCOUT_API_KEY secret is missing."; exit 1; }
          [[ "$PRIVATE_KEY" == 0x* ]] || PRIVATE_KEY="0x$PRIVATE_KEY"
          echo "::add-mask::$PRIVATE_KEY"
          export PRIVATE_KEY
          CHAIN_ID=$(cast chain-id --rpc-url "$BOTCHAIN_RPC_URL")
          test "$CHAIN_ID" = "677" || { echo "RPC returned chain ID $CHAIN_ID; expected 677."; exit 1; }
          forge script contracts/script/DeployBotchain.s.sol:DeployBotchain \
            --root contracts \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$BOTCHAIN_VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow
      - name: Save deployed address
        shell: bash
        run: |
          ADDRESS=$(jq -r '.transactions[] | select(.transactionType == "CREATE") | .contractAddress' contracts/broadcast/DeployBotchain.s.sol/677/run-latest.json | tail -n 1)
          test "$ADDRESS" != "null" && test -n "$ADDRESS"
          node scripts/update-deployment.mjs "$ADDRESS"
          echo "### QuestForge Mainnet deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract: [$ADDRESS](https://scan.botchain.ai/address/$ADDRESS)" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit mainnet address
        shell: bash
        run: |
          if git diff --quiet -- lib/deployment.ts; then echo "The recorded mainnet address is already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deployment.ts
          git commit -m "chore: record BOT Chain mainnet deployment"
          git push
