name: Deploy QuestForge to BOT Chain Testnet

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: questforge-testnet-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test contract
        run: forge test --root contracts -vvv
      - name: Check deployment secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "PRIVATE_KEY secret is missing"; exit 1; }
          test -n "$BLOCKSCOUT_API_KEY" || { echo "BLOCKSCOUT_API_KEY secret is missing"; exit 1; }
      - name: Deploy and verify
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          BOTCHAIN_RPC_URL: https://rpc.bohr.life
          BOTCHAIN_VERIFIER_URL: https://scan.bohr.life/api/
        run: |
          forge script contracts/script/DeployBotchain.s.sol:DeployBotchain \
            --root contracts \
            --rpc-url "$BOTCHAIN_RPC_URL" \
            --broadcast \
            --verify \
            --verifier blockscout \
            --verifier-url "$BOTCHAIN_VERIFIER_URL" \
            --etherscan-api-key "$BLOCKSCOUT_API_KEY" \
            --slow
      - name: Save deployed address
        run: |
          ADDRESS=$(jq -r '.transactions[] | select(.transactionType == "CREATE") | .contractAddress' contracts/broadcast/DeployBotchain.s.sol/968/run-latest.json | tail -n 1)
          test "$ADDRESS" != "null" && test -n "$ADDRESS"
          node scripts/update-deployment.mjs "$ADDRESS"
          echo "### QuestForge deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract: [$ADDRESS](https://scan.bohr.life/address/$ADDRESS)" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit deployment address
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/deployment.ts
          git commit -m "chore: record BOT Chain testnet deployment"
          git push
